name: Build macOS AU

# Runs on every push, and by hand from the Actions tab ("Run workflow").
on: [push, workflow_dispatch]

jobs:
  build-au:
    runs-on: macos-14

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Get JUCE 9.0.3
        run: git clone --depth 1 --branch 9.0.3 https://github.com/juce-framework/JUCE.git external/JUCE

      - name: Configure (Universal - Apple Silicon + Intel)
        run: |
          cmake -B build-mac -G "Unix Makefiles" \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
                -DJUCE_DIR="$PWD/external/JUCE" \
                -DAS22_BUILD_TESTS=ON

      - name: Build AU and tests
        run: |
          cmake --build build-mac --config Release -j "$(sysctl -n hw.ncpu)" \
                --target ArksSonic22_AU DspTest PassthroughTest CpuBenchmark

      # The same offline tests as on Windows, here on macOS / Apple Silicon (clang).
      - name: Run tests (Apple Silicon)
        run: |
          mkdir -p dist
          {
            echo "== PassthroughTest"; build-mac/PassthroughTest
            echo; echo "== DspTest"; build-mac/DspTest
            echo; echo "== CpuBenchmark"; build-mac/CpuBenchmark 10
          } 2>&1 | tee dist/test-results-macos-arm64.txt

      # Intel slice through Rosetta, when the runner has it (not required for the build to pass).
      - name: Run tests (Intel slice via Rosetta)
        continue-on-error: true
        run: |
          { arch -x86_64 build-mac/PassthroughTest && arch -x86_64 build-mac/DspTest; } 2>&1 \
              | tee dist/test-results-macos-x86_64.txt

      - name: Validate with auval
        run: |
          COMPONENT="build-mac/ArksSonic22_artefacts/Release/AU/Arks Sonic 22.component"
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$COMPONENT" ~/Library/Audio/Plug-Ins/Components/
          codesign --force --deep --sign - ~/Library/Audio/Plug-Ins/Components/"Arks Sonic 22.component"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aufx Ss22 Arks 2>&1 | tee dist/auval.txt

      # Should print x86_64 + arm64 and minos 10.13 (x86_64) / 11.0 (arm64).
      - name: Check minimum macOS of the binary
        run: |
          BIN="build-mac/ArksSonic22_artefacts/Release/AU/Arks Sonic 22.component/Contents/MacOS/Arks Sonic 22"
          lipo -info "$BIN"
          otool -l "$BIN" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" | grep -E "minos|version"

      # upload-artifact drops file permissions, so the bundle goes in as a ditto zip (keeps the
      # executable bit of the plugin binary). install_mac.sh unpacks and installs it.
      - name: Package
        run: |
          ditto -c -k --keepParent "build-mac/ArksSonic22_artefacts/Release/AU/Arks Sonic 22.component" \
                "dist/Arks Sonic 22.component.zip"
          cp install_mac.sh dist/
          cp README.md dist/
          mkdir -p dist/images && cp docs/images/editor.png dist/images/ 2>/dev/null || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArksSonic22-AU-mac
          path: dist
